<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>眨眼搞怪机器人</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 30%, #2b3a55, #0d1220 70%);
    color: #dfe8ff;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
  #robot { width: min(360px, 90vw); cursor: pointer; user-select: none; }

  #robot .head,
  #robot .eye-shape,
  #robot .blink,
  #robot .brow,
  #robot .spiral,
  #robot .tongue {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .25s ease;
  }
  #robot .head { transform-origin: 50% 100%; }
  #robot .pupil { transition: transform .1s linear; }
  #robot .mouth { transition: d .25s ease; }
  #robot .eye-glow { filter: drop-shadow(0 0 6px #3ff) drop-shadow(0 0 12px #0cf); }
  #robot .cheek, #robot .tongue, #robot .teeth, #robot .spiral { transition: opacity .25s; }

  #robot .bulb { animation: pulse 1.6s ease-in-out infinite; }
  #robot.dizzy .head { animation: wobble 1s ease-in-out infinite; }
  #robot.dizzy .spiral { animation: spin .9s linear infinite; }
  #robot.crazy .head { animation: shake .35s linear infinite; }
  #robot .tongue.show { animation: wag .5s ease-in-out infinite alternate; }

  @keyframes pulse { 50% { fill: #ff5577; filter: drop-shadow(0 0 8px #f57); } }
  @keyframes wobble { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(6deg); }
    25% { transform: translateX(-4px) rotate(9deg); }
    75% { transform: translateX(4px) rotate(3deg); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wag { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 560px; }
  button {
    padding: 8px 14px;
    border: 1px solid #4a6fa5;
    border-radius: 20px;
    background: #1a2740;
    color: #dfe8ff;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #26395e; }
  button.active { background: #3ad0ff; color: #0d1220; border-color: #3ad0ff; }
  .hint { font-size: 13px; opacity: .6; }
</style>
</head>
<body>
<h1>眨眼搞怪机器人</h1>

<svg id="robot" viewBox="0 0 300 380" aria-label="机器人">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6e8"/>
      <stop offset="1" stop-color="#7d8ea8"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <rect x="130" y="248" width="40" height="22" fill="#5d6d86"/>
  <rect x="70" y="266" width="160" height="104" rx="24" fill="url(#metal)"/>
  <rect x="92" y="284" width="116" height="42" rx="8" fill="#102030"/>
  <text id="mood" x="150" y="311" text-anchor="middle" fill="#3ff" font-size="16" font-family="monospace">正常</text>
  <circle cx="105" cy="346" r="7" fill="#ffcc33"/>
  <circle cx="150" cy="346" r="7" fill="#33ff99"/>
  <circle cx="195" cy="346" r="7" fill="#ff5577"/>

  <g class="head">
    <!-- antenna -->
    <line x1="150" y1="72" x2="150" y2="38" stroke="#7d8ea8" stroke-width="5"/>
    <circle class="bulb" cx="150" cy="30" r="10" fill="#ffcc33"/>
    <!-- ears -->
    <rect x="34" y="130" width="20" height="56" rx="6" fill="#6b7c96"/>
    <rect x="246" y="130" width="20" height="56" rx="6" fill="#6b7c96"/>
    <!-- head -->
    <rect x="50" y="70" width="200" height="180" rx="40" fill="url(#metal)"/>
    <!-- brows -->
    <rect class="brow" id="browL" x="92" y="88" width="46" height="8" rx="4" fill="#33415a"/>
    <rect class="brow" id="browR" x="162" y="88" width="46" height="8" rx="4" fill="#33415a"/>
    <!-- visor -->
    <rect x="68" y="104" width="164" height="78" rx="32" fill="#102030"/>

    <g class="eye-shape" id="eyeL">
      <g class="blink">
        <circle class="eye-glow" cx="115" cy="143" r="26" fill="#3ff"/>
        <g class="pupil">
          <circle cx="115" cy="143" r="11" fill="#0d1220"/>
          <circle cx="119" cy="139" r="3.5" fill="#fff"/>
        </g>
        <path class="spiral" opacity="0" fill="none" stroke="#0d1220" stroke-width="3"
          d="M115 143 a2 2 0 0 1 4 0 a4 4 0 0 1 -8 0 a6 6 0 0 1 12 0 a8 8 0 0 1 -16 0 a10 10 0 0 1 20 0 a12 12 0 0 1 -24 0 a14 14 0 0 1 28 0 a16 16 0 0 1 -32 0"/>
      </g>
    </g>
    <g class="eye-shape" id="eyeR">
      <g class="blink">
        <circle class="eye-glow" cx="185" cy="143" r="26" fill="#3ff"/>
        <g class="pupil">
          <circle cx="185" cy="143" r="11" fill="#0d1220"/>
          <circle cx="189" cy="139" r="3.5" fill="#fff"/>
        </g>
        <path class="spiral" opacity="0" fill="none" stroke="#0d1220" stroke-width="3"
          d="M185 143 a2 2 0 0 1 4 0 a4 4 0 0 1 -8 0 a6 6 0 0 1 12 0 a8 8 0 0 1 -16 0 a10 10 0 0 1 20 0 a12 12 0 0 1 -24 0 a14 14 0 0 1 28 0 a16 16 0 0 1 -32 0"/>
      </g>
    </g>

    <ellipse class="cheek" cx="84" cy="206" rx="14" ry="8" fill="#ff7799" opacity="0"/>
    <ellipse class="cheek" cx="216" cy="206" rx="14" ry="8" fill="#ff7799" opacity="0"/>

    <path class="mouth" id="mouth" fill="#1b2335" stroke="#33415a" stroke-width="3" stroke-linejoin="round"/>
    <g class="teeth" opacity="0">
      <rect x="106" y="202" width="88" height="13" rx="3" fill="#f4f7ff"/>
      <path d="M128 202v13M150 202v13M172 202v13" stroke="#9aa8c0" stroke-width="2"/>
    </g>
    <g class="tongue" opacity="0">
      <path d="M133 226 Q131 268 150 268 Q169 268 167 226 Z" fill="#ff5d7a" stroke="#c23a55" stroke-width="2"/>
      <path d="M150 232 V256" stroke="#c23a55" stroke-width="2"/>
    </g>
  </g>
</svg>

<div class="controls" id="controls"></div>
<button id="auto">自动搞怪：关</button>
<div class="hint">点机器人随机来一个鬼脸 · 正常模式下眼睛会跟着鼠标转</div>

<script>
// All mouth paths share the same command structure so CSS can morph between them.
const MOUTH = {
  neutral: 'M115 212 Q132 214 150 214 Q168 214 185 212 Q168 220 150 220 Q132 220 115 212 Z',
  smile:   'M108 204 Q128 210 150 210 Q172 210 192 204 Q178 246 150 246 Q122 246 108 204 Z',
  o:       'M134 216 Q136 194 150 194 Q164 194 166 216 Q164 238 150 238 Q136 238 134 216 Z',
  smirk:   'M118 216 Q140 220 160 215 Q178 210 190 196 Q182 224 160 224 Q138 226 118 216 Z',
  wavy:    'M108 212 Q129 194 150 212 Q171 230 192 212 Q171 240 150 222 Q129 204 108 212 Z',
  wobble:  'M118 222 Q134 208 150 214 Q166 220 182 208 Q167 226 150 222 Q133 228 118 222 Z',
  grin:    'M102 200 Q126 200 150 200 Q174 200 198 200 Q190 238 150 238 Q110 238 102 200 Z',
};

// eyes: [left, right] {sx, sy}; pupils: [[dx,dy],[dx,dy]]; brows: [{y, r}, {y, r}]
const FACES = {
  normal:   { label: '正常',   mouth: 'neutral' },
  happy:    { label: '开心',   mouth: 'smile', eyes: [{ sy: .7 }, { sy: .7 }], brows: [{ y: -6 }, { y: -6 }], blush: true },
  wink:     { label: '抛媚眼', mouth: 'smirk', eyes: [{ sy: .08 }, {}], pupils: [[0, 0], [5, -3]],
              brows: [{ y: 6, r: 10 }, { y: -10, r: -8 }], tilt: -6, blush: true },
  tongue:   { label: '吐舌头', mouth: 'smile', tongue: true, eyes: [{ sy: .3 }, { sy: .3 }],
              brows: [{ y: -4, r: -10 }, { y: -4, r: 10 }], tilt: 5 },
  crosseye: { label: '斗鸡眼', mouth: 'smile', tongue: true, pupils: [[14, 6], [-14, 6]],
              brows: [{ y: -8, r: 12 }, { y: -8, r: -12 }], tilt: -4 },
  surprise: { label: '惊呆',   mouth: 'o', eyes: [{ sx: 1.2, sy: 1.25 }, { sx: 1.2, sy: 1.25 }], pupils: [[0, 0], [0, 0]],
              brows: [{ y: -16 }, { y: -16 }] },
  crazy:    { label: '鬼脸',   mouth: 'wavy', cls: 'crazy', eyes: [{ sx: 1.35, sy: 1.35 }, { sx: .55, sy: .55 }],
              pupils: [[-9, -7], [7, 7]], brows: [{ y: -18, r: -15 }, { y: 8, r: 22 }] },
  dizzy:    { label: '晕乎乎', mouth: 'wobble', cls: 'dizzy', spiral: true, brows: [{ y: -6, r: -8 }, { y: 2, r: 10 }] },
  grin:     { label: '呲牙',   mouth: 'grin', teeth: true, eyes: [{ sy: .55 }, { sy: .55 }],
              brows: [{ y: 6, r: 15 }, { y: 6, r: -15 }] },
};

const robot = document.getElementById('robot');
const $ = s => robot.querySelector(s);
const eyes = [$('#eyeL'), $('#eyeR')];
const brows = [$('#browL'), $('#browR')];
const pupils = [...robot.querySelectorAll('.pupil')];
const blinks = [...robot.querySelectorAll('.blink')];
const mouth = $('#mouth');
const head = $('.head');
let current = 'normal';

function setFace(name) {
  const f = FACES[name];
  current = name;
  robot.classList.remove('crazy', 'dizzy');
  if (f.cls) robot.classList.add(f.cls);

  const d = MOUTH[f.mouth];
  mouth.setAttribute('d', d);
  mouth.style.d = `path("${d}")`;

  eyes.forEach((el, i) => {
    const e = (f.eyes && f.eyes[i]) || {};
    el.style.transform = `scale(${e.sx ?? 1}, ${e.sy ?? 1})`;
  });
  brows.forEach((el, i) => {
    const b = (f.brows && f.brows[i]) || {};
    el.style.transform = `translateY(${b.y ?? 0}px) rotate(${b.r ?? 0}deg)`;
  });
  pupils.forEach((el, i) => {
    const [x, y] = f.pupils ? f.pupils[i] : [0, 0];
    el.style.transform = `translate(${x}px, ${y}px)`;
    el.style.opacity = f.spiral ? 0 : 1;
  });
  robot.querySelectorAll('.spiral').forEach(el => el.style.opacity = f.spiral ? 1 : 0);
  robot.querySelectorAll('.cheek').forEach(el => el.style.opacity = f.blush ? .8 : 0);
  $('.teeth').style.opacity = f.teeth ? 1 : 0;
  const tongue = $('.tongue');
  tongue.style.opacity = f.tongue ? 1 : 0;
  tongue.classList.toggle('show', !!f.tongue);
  head.style.transform = `rotate(${f.tilt ?? 0}deg)`;

  $('#mood').textContent = f.label;
  document.querySelectorAll('#controls button').forEach(b => b.classList.toggle('active', b.dataset.face === name));
}

function blink() {
  if (current === 'dizzy') return;
  blinks.forEach(el => el.animate(
    [{ transform: 'scaleY(1)' }, { transform: 'scaleY(0.05)' }, { transform: 'scaleY(1)' }],
    { duration: 160, easing: 'ease-in-out' }
  ));
}

(function scheduleBlink() {
  setTimeout(() => {
    blink();
    if (Math.random() < 0.25) setTimeout(blink, 220);
    scheduleBlink();
  }, 1500 + Math.random() * 3500);
})();

// Pupils follow the cursor only when the current face doesn't pin them.
document.addEventListener('mousemove', e => {
  if (FACES[current].pupils || FACES[current].spiral) return;
  pupils.forEach(p => {
    const r = p.parentNode.querySelector('.eye-glow').getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy) || 1;
    const k = Math.min(9, dist / 25) / dist;
    p.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  });
});

const controls = document.getElementById('controls');
Object.entries(FACES).forEach(([key, f]) => {
  const b = document.createElement('button');
  b.textContent = f.label;
  b.dataset.face = key;
  b.onclick = () => setFace(key);
  controls.appendChild(b);
});

const funny = Object.keys(FACES).filter(k => k !== 'normal');
function randomFace() {
  let k;
  do { k = funny[Math.floor(Math.random() * funny.length)]; } while (k === current);
  setFace(k);
}

let clickTimer;
robot.addEventListener('click', () => {
  randomFace();
  clearTimeout(clickTimer);
  if (!autoTimer) clickTimer = setTimeout(() => setFace('normal'), 2000);
});

let autoTimer = null;
const autoBtn = document.getElementById('auto');
autoBtn.onclick = () => {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    setFace('normal');
  } else {
    randomFace();
    autoTimer = setInterval(randomFace, 2200);
  }
  autoBtn.textContent = `自动搞怪：${autoTimer ? '开' : '关'}`;
  autoBtn.classList.toggle('active', !!autoTimer);
};

setFace('normal');
</script>
</body>
</html>
