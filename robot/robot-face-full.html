<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酷飒机器人</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, #0c1a24 0%, #05070b 70%);
  }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px);
  }
  #face {
    position: relative; display: block; width: 100vw; height: 100vh;
    cursor: crosshair; color: #00e5ff; transition: color .3s;
  }
  #face .glow { filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 12px currentColor); }

  #face .float, #face .jitter, #face .tilt, #face .blink, #face .brow, #face .reticle {
    transform-box: fill-box;
    transform-origin: center;
  }
  #face .tilt { transition: transform .35s ease-out; }
  #face .look { transition: transform .12s ease-out; }
  #face .brow { transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
  #face .eye, #face .mouth { transition: d .22s ease-out; }
  #face .reticle, #face .scanbar { opacity: 0; transition: opacity .2s; }
  #face .shades { transform: translateY(-240px); transition: transform .5s cubic-bezier(.3, 1.4, .6, 1); }

  #face .float { animation: float 5s ease-in-out infinite; }
  #face .reticle { animation: spin 4s linear infinite; }
  #face.shades-on .shades { transform: translateY(0); }
  #face.shades-on .glint { animation: glint 2.4s ease-in-out .4s infinite; }
  #face.lock .reticle { opacity: 1; }
  #face.lock .hud-mode { animation: flash .5s steps(1) infinite; }
  #face.scanning .scanbar { opacity: 1; animation: scan .9s ease-in-out infinite alternate; }
  #face.rage .jitter { animation: jitter .1s steps(2) infinite; }
  #face.glitch .jitter { animation: glitch .26s steps(5); }
  #face.boot .jitter { animation: boot 1s steps(1) both; }
  #face.standby .eye { animation: pulse 3s ease-in-out infinite; }

  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glint { from { transform: translateX(0); } 60%,to { transform: translateX(320px); } }
  @keyframes scan { from { transform: translateY(-26px); } to { transform: translateY(26px); } }
  @keyframes flash { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes jitter { 0% { transform: translate(-1px, 1px); } 100% { transform: translate(1px, -1px); } }
  @keyframes glitch {
    0% { transform: translate(0, 0); opacity: 1; }
    25% { transform: translate(-7px, 1px); opacity: .5; }
    50% { transform: translate(6px, -2px); opacity: .9; }
    75% { transform: translate(-2px, 0); opacity: .6; }
    100% { transform: translate(0, 0); opacity: 1; }
  }
  @keyframes boot {
    0% { opacity: 0; } 12% { opacity: 1; } 18% { opacity: 0; } 30% { opacity: 1; }
    36% { opacity: .2; } 48% { opacity: 1; }
  }

  .ripple {
    position: fixed; width: 140px; height: 140px; margin: -70px 0 0 -70px;
    border: 2px solid; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 12px currentColor, inset 0 0 12px currentColor;
    animation: ripple .7s ease-out both;
  }
  @keyframes ripple { from { transform: scale(.1); opacity: 1; } to { transform: scale(1); opacity: 0; } }
</style>
</head>
<body>
<svg id="face" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" aria-label="酷飒机器人">
  <defs>
    <clipPath id="lens">
      <path d="M96 110 L190 110 L184 150 Q172 162 142 160 Q108 158 100 146 Z"/>
      <path d="M304 110 L210 110 L216 150 Q228 162 258 160 Q292 158 300 146 Z"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45">
    <path d="M8 28 V8 H28 M372 8 H392 V28 M392 272 V292 H372 M28 292 H8 V272"/>
  </g>
  <g font-family="Consolas, monospace" font-size="9" fill="currentColor" opacity=".75">
    <text x="16" y="22">◢ UNIT-07 // ONLINE</text>
    <text class="hud-mode" id="hudMode" x="384" y="284" text-anchor="end"></text>
  </g>

  <g class="float"><g class="jitter"><g class="tilt">
    <path class="brow glow" fill="currentColor" d="M108 96 L182 101 L182 108 L108 103 Z"/>
    <path class="brow glow" fill="currentColor" d="M292 96 L218 101 L218 108 L292 103 Z"/>

    <g class="blink"><g class="look"><path class="eye glow" fill="currentColor"/></g></g>
    <g class="blink"><g class="look"><path class="eye glow" fill="currentColor"/></g></g>

    <rect class="scanbar glow" x="95" y="134" width="210" height="2.5" fill="currentColor"/>

    <g class="reticle glow" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="255" cy="135" r="46" stroke-dasharray="16 9"/>
      <path d="M255 81 V97 M255 173 V189 M197 135 H213 M297 135 H313"/>
    </g>

    <g stroke="currentColor" stroke-width="2" opacity=".5">
      <path d="M92 178 L106 170 M98 186 L112 178 M308 178 L294 170 M302 186 L288 178"/>
    </g>

    <path class="mouth glow" id="mouth" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="square"/>

    <g class="shades">
      <path d="M96 116 L66 108 M304 116 L334 108 M188 120 L212 120" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="M96 110 L190 110 L184 150 Q172 162 142 160 Q108 158 100 146 Z" fill="#0a0c10" stroke="currentColor" stroke-width="2.5"/>
      <path d="M304 110 L210 110 L216 150 Q228 162 258 160 Q292 158 300 146 Z" fill="#0a0c10" stroke="currentColor" stroke-width="2.5"/>
      <g clip-path="url(#lens)">
        <path class="glint" d="M60 100 L80 100 L50 170 L30 170 Z" fill="#fff" opacity=".35"/>
      </g>
    </g>
  </g></g></g>
</svg>

<script>
const CYAN = '#00e5ff', RED = '#ff2d55', DIM = '#1d6f7a';
const EYE_POS = [[145, 135], [255, 135]];
const EYE_HALF_W = 36;

// Offsets from eye centre: to/bo = outer top/bottom, ti/bi = inner (nose-side) top/bottom.
const EYE = {
  cool:   { to: -14, ti: -6, bi: 10, bo: 12 },
  squint: { to: -5, ti: -2, bi: 4, bo: 5 },
  wide:   { to: -20, ti: -18, bi: 18, bo: 20 },
  angry:  { to: -16, ti: 4, bi: 12, bo: 12 },
  smug:   { to: -1, ti: 0, bi: 11, bo: 12 },
  closed: { to: -1, ti: -1, bi: 1, bo: 1 },
};

// All mouth paths share the same command structure so CSS can morph between them.
const MOUTH = {
  flat:  'M172 206 Q186 206 200 206 Q214 206 228 206',
  tight: 'M186 206 Q193 206 200 206 Q207 206 214 206',
  smirk: 'M174 207 Q190 209 204 206 Q218 203 230 194',
  frown: 'M174 209 Q187 203 200 203 Q213 203 226 209',
};

// eyes: EYE key or [left, right]; brows: [{y, r}, {y, r}]; look pins the gaze.
const FACES = {
  cool:    { eyes: 'cool', mouth: 'flat', hud: 'MODE // COOL' },
  smirk:   { eyes: ['cool', 'smug'], mouth: 'smirk', brows: [{}, { y: -8, r: 6 }], tilt: 4, hud: 'MODE // SMIRK' },
  brow:    { eyes: ['wide', 'cool'], mouth: 'tight', brows: [{ y: -16, r: -6 }, { y: 3 }], hud: 'MODE // HMM?' },
  shades:  { eyes: 'cool', mouth: 'smirk', cls: 'shades-on', tilt: -3, hud: 'MODE // DEAL WITH IT' },
  squint:  { eyes: 'squint', look: [-10, 0], mouth: 'flat', brows: [{ y: 6 }, { y: 6 }], hud: 'ANALYZING...' },
  side:    { eyes: 'smug', look: [12, -6], mouth: 'frown', brows: [{ y: -4 }, { y: -4 }], tilt: 3, hud: 'MODE // WHATEVER' },
  angry:   { eyes: 'angry', mouth: 'frown', color: RED, cls: 'rage',
             brows: [{ y: 8, r: 14 }, { y: 8, r: -14 }], hud: 'WARNING // ANGRY' },
  lock:    { eyes: ['squint', 'wide'], look: [0, 0], mouth: 'tight', color: RED, cls: 'lock',
             brows: [{ y: 6, r: 6 }, { y: -6 }], hud: 'TARGET LOCKED' },
  scan:    { eyes: 'wide', look: [0, 0], mouth: 'tight', cls: 'scanning', hud: 'SCANNING...' },
  standby: { eyes: 'closed', mouth: 'tight', color: DIM, cls: 'standby', hud: 'STANDBY' },
  boot:    { eyes: 'wide', mouth: 'flat', cls: 'boot', hud: 'REBOOTING...' },
};
const STATE_CLASSES = ['shades-on', 'rage', 'lock', 'scanning', 'standby', 'boot'];

function eyePath([cx, cy], s, dir) {
  const X = x => cx + x * dir;
  const W = EYE_HALF_W;
  return `M${X(-W)} ${cy + (s.to + s.bo) / 2} L${X(-W + 10)} ${cy + s.to} L${X(W)} ${cy + s.ti} `
       + `L${X(W)} ${cy + s.bi} L${X(-W + 10)} ${cy + s.bo} Z`;
}

const face = document.getElementById('face');
const $ = s => face.querySelector(s);
const $$ = s => [...face.querySelectorAll(s)];
const eyes = $$('.eye');
const looks = $$('.look');
const brows = $$('.brow');
const mouth = $('#mouth');
let current = 'cool';

const eyeTypes = f => (Array.isArray(f.eyes) ? f.eyes : [f.eyes, f.eyes]);
const followsCursor = f => !f.look && f.cls !== 'standby';

function morph(el, d) {
  el.setAttribute('d', d);
  el.style.d = `path("${d}")`;
}

function setFace(name) {
  const f = FACES[name];
  current = name;
  face.classList.remove(...STATE_CLASSES);
  if (f.cls) face.classList.add(f.cls);
  face.style.color = f.color || CYAN;

  const types = eyeTypes(f);
  eyes.forEach((el, i) => morph(el, eyePath(EYE_POS[i], EYE[types[i]], i ? -1 : 1)));
  const [lx, ly] = f.look || [0, 0];
  looks.forEach(l => l.style.transform = `translate(${lx}px, ${ly}px)`);
  brows.forEach((el, i) => {
    const b = (f.brows && f.brows[i]) || {};
    el.style.transform = `translateY(${b.y ?? 0}px) rotate(${b.r ?? 0}deg)`;
  });
  morph(mouth, MOUTH[f.mouth]);
  $('.tilt').style.transform = `rotate(${f.tilt ?? 0}deg)`;
  $('#hudMode').textContent = f.hud;
}

function blink() {
  const f = FACES[current];
  if (f.cls === 'shades-on' || eyeTypes(f).includes('closed')) return;
  $$('.blink').forEach(el => el.animate(
    [{ transform: 'scaleY(1)' }, { transform: 'scaleY(0.05)' }, { transform: 'scaleY(1)' }],
    { duration: 120, easing: 'ease-in-out' }
  ));
}

(function scheduleBlink() {
  setTimeout(() => { blink(); scheduleBlink(); }, 2500 + Math.random() * 4000);
})();

(function scheduleGlitch() {
  setTimeout(() => {
    if (current !== 'standby') {
      face.classList.add('glitch');
      setTimeout(() => face.classList.remove('glitch'), 260);
    }
    scheduleGlitch();
  }, 6000 + Math.random() * 8000);
})();

let lastActive = Date.now(), sleeping = false, backTimer;

function show(name, ms = 3000) {
  setFace(name);
  clearTimeout(backTimer);
  backTimer = setTimeout(() => { if (!sleeping) setFace('cool'); }, ms);
}

// Returns true if the robot was in standby and has just been woken up.
function wake() {
  lastActive = Date.now();
  if (!sleeping) return false;
  sleeping = false;
  show('boot', 1100);
  return true;
}

document.addEventListener('pointermove', e => {
  wake();
  if (!followsCursor(FACES[current])) return;
  looks.forEach(l => {
    const r = l.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy) || 1;
    const k = Math.min(6, dist / 40) / dist;
    l.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  });
});

function ripple(x, y) {
  for (let i = 0; i < 2; i++) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = `${x}px`;
    r.style.top = `${y}px`;
    r.style.color = getComputedStyle(face).color;
    r.style.animationDelay = `${i * .12}s`;
    r.addEventListener('animationend', () => r.remove());
    document.body.appendChild(r);
  }
}

face.addEventListener('click', e => {
  ripple(e.clientX, e.clientY);
  if (wake()) return;
  const picks = ['shades', 'smirk', 'lock'];
  show(picks[Math.floor(Math.random() * picks.length)]);
});

const moods = ['smirk', 'brow', 'shades', 'squint', 'side', 'angry', 'lock', 'scan'];
(function scheduleMood() {
  setTimeout(() => {
    if (!sleeping) {
      if (Date.now() - lastActive > 20000) {
        sleeping = true;
        clearTimeout(backTimer);
        setFace('standby');
      } else {
        let k;
        do { k = moods[Math.floor(Math.random() * moods.length)]; } while (k === current);
        show(k);
      }
    }
    scheduleMood();
  }, 5000 + Math.random() * 4000);
})();

setFace('cool');
</script>
</body>
</html>
